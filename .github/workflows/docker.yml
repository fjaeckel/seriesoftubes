name: Container image

# Publishes ghcr.io/<owner>/<repo>:<version> for releases, and nothing else: auto-release.yml dispatches this workflow
# with the new tag (pre-releases too). There is no :latest and no image per commit. Pushes and pull requests that change
# what goes into the image only build it and try both modes; they never publish. The image packages the MCP server and
# the development server; the game itself is hosted on GitHub Pages only (docs/adr/0001-github-pages-only.md).
#
# The multiplayer relay (relay/, docs/adr/0005-federation-by-player-run-servers.md) is a second, separate image built
# the same way: ghcr.io/<owner>/<repo>-relay, from relay/Dockerfile, for linux/amd64 and linux/arm64. It is a tool
# players run on their own servers (docs/HOSTING.md); the project runs none. It is tagged with the exact version, and,
# for a release that is not a pre-release, with X.Y when it is the newest of its X.Y line and with latest when it is
# the newest release of all (an older tag rebuilt later never moves either).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (e.g. v2.10.1)
        required: true
  push:
    branches: [main]
    paths:
      - docker/**
      - relay/**
      - .dockerignore
      - package.json
      - package-lock.json
      - scripts/**
      - tests/harness.js
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - docker/**
      - relay/**
      - .dockerignore
      - package.json
      - package-lock.json
      - scripts/**
      - tests/harness.js
      - .github/workflows/docker.yml

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event_name }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # A push that bumps the version is a release on its way: once CI passes, auto-release.yml starts this workflow for
  # the tag, which tests the same code before it publishes. Testing the push too would be the same run twice.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
      relay: ${{ steps.g.outputs.relay }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || '' }}
          persist-credentials: false
      - id: g
        run: |
          # A release from before the relay has no relay image to build.
          if [ -f relay/Dockerfile ]; then echo "relay=true" >> "$GITHUB_OUTPUT"; else echo "relay=false" >> "$GITHUB_OUTPUT"; fi
          tag="v$(jq -r .version package.json)"
          if [ "$GITHUB_EVENT_NAME" = push ] && ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is not tagged yet: the release will test this commit when it publishes."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || '' }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for this runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: sot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Try both modes
        run: |
          set -euo pipefail
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          mcp() { curl -sS -o /tmp/out -w '%{http_code}' -X POST http://127.0.0.1:7777/mcp \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' "$@" -d "$init"; }
          until_up() { for i in $(seq 1 60); do curl -s -o /dev/null "$1" && return 0; sleep 1; done; docker logs "$2"; exit 1; }

          # Headless, with a token: refused without it, answered with it.
          docker run -d --name sot-h -p 127.0.0.1:7777:7777 -e MCP_MODE=headless -e SOT_MCP_TOKEN=ci-token sot:test
          until_up http://127.0.0.1:7777/ sot-h
          test "$(mcp)" = 401
          test "$(mcp -H 'authorization: Bearer ci-token')" = 200
          grep -q serverInfo /tmp/out
          docker rm -f sot-h

          # No token given: the container makes one, says so, and wants it.
          docker run -d --name sot-t -p 127.0.0.1:7777:7777 -e MCP_MODE=headless sot:test
          until_up http://127.0.0.1:7777/ sot-t
          test "$(mcp)" = 401
          tok=$(docker logs sot-t 2>&1 | sed -n "s/.*this run's token is //p" | head -1)
          test -n "$tok"
          test "$(mcp -H "authorization: Bearer $tok")" = 200
          docker rm -f sot-t

          # Browser mode: the development page and the MCP server.
          docker run -d --name sot-b -p 127.0.0.1:8080:8080 -p 127.0.0.1:7777:7777 -e SOT_MCP_TOKEN=ci-token sot:test
          until_up http://127.0.0.1:8080/ sot-b
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 200
          until_up http://127.0.0.1:7777/ sot-b
          test "$(mcp -H 'authorization: Bearer ci-token')" = 200
          docker rm -f sot-b

          # The server runs as node, not root.
          test "$(docker run --rm --entrypoint id sot:test -u)" != 0

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Not a release tag: $TAG"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Work out the image name and version
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          want="v$(jq -r .version package.json)"
          if [ "$TAG" != "$want" ]; then echo "::error::Release tag $TAG does not match package.json ($want)"; exit 1; fi
          # Named after this repository (ghcr.io/<owner>/<repo>, lowercased), so forks publish their own.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the release's version
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=Series of Tubes MCP server
            org.opencontainers.image.description=The Series of Tubes MCP server and development server, so an AI client can play the game.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/${{ inputs.tag }}/docs/MCP.md
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The relay image: built for both platforms on every change to relay/ (never pushed), so an arm64 break shows before
  # a release does.
  relay-test:
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || '' }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the relay for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: relay
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=relay
          cache-to: type=gha,scope=relay,mode=max

  relay-publish:
    if: github.event_name == 'workflow_dispatch' && needs.gate.outputs.relay == 'true'
    needs: [gate, relay-test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Not a release tag: $TAG"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Work out the image name and version
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          want="v$(jq -r .version package.json)"
          if [ "$TAG" != "$want" ]; then echo "::error::Release tag $TAG does not match package.json ($want)"; exit 1; fi
          # ghcr.io/<owner>/<repo>-relay, lowercased: a package of its own, next to the MCP server's image.
          image="ghcr.io/${GITHUB_REPOSITORY,,}-relay"
          ver="${TAG#v}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
          # Moving tags only for the newest: the release tags as they are now (this one included), pre-releases left out.
          tags="$image:$ver"
          case "$ver" in
            *-*) echo "$ver is a pre-release: its version tag only." ;;
            *)
              released=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed -n 's#.*refs/tags/v\([0-9]*\.[0-9]*\.[0-9]*\)$#\1#p' | sort -V)
              line="${ver%.*}"
              if [ "$(printf '%s\n' "$released" | awk -F. -v l="$line" '$1"."$2 == l' | tail -n1)" = "$ver" ]; then
                tags="$tags"$'\n'"$image:$line"
              fi
              if [ "$(printf '%s\n' "$released" | tail -n1)" = "$ver" ]; then
                tags="$tags"$'\n'"$image:latest"
              fi ;;
          esac
          echo "$tags"
          { echo "tags<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the relay for the release's version
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: relay
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Series of Tubes relay
            org.opencontainers.image.description=A multiplayer relay server for Series of Tubes, for players to run on their own servers.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/blob/${{ inputs.tag }}/docs/HOSTING.md
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/${{ inputs.tag }}/docs/RELAY.md
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=relay
          cache-to: type=gha,scope=relay,mode=max
