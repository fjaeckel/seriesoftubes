name: CI

# Every push and PR, and the releases too (auto-release.yml and release.yml call this workflow), so the tests run
# one way, split over several runners, everywhere.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to test (a release tag); the caller's commit when empty
        type: string
        default: ''

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless: cancel it instead of queueing behind it.
# Runs on main always finish. A release's call gets a group of its own, so it never waits behind main's push run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}${{ inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Runners for the tests. Standard GitHub-hosted runners (4 cores each) are the only free ones for a public repo,
  # and a run may use up to 20 at once, so more parts is how the tests get faster. Each part costs ~30 s of setup.
  PARTS: 6

jobs:
  # Splits the test files into parts of about equal time, once, so every part works from the same plan. The times
  # come from the last run on main (the cache, see "timings" below), else from the committed tests/durations.json.
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/durations.json
          key: test-durations-${{ github.run_id }}
          restore-keys: test-durations-
      - id: plan
        run: echo "parts=$(node scripts/test.js --plan "$PARTS")" >> "$GITHUB_OUTPUT"

  part:
    name: part ${{ strategy.job-index }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        files: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests
        env:
          FILES: ${{ matrix.files }}
        # Word splitting on purpose: FILES is a space-separated list of tests/*.test.js paths.
        run: npm test -- --timings "$RUNNER_TEMP/timings.json" $FILES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: timings-${{ strategy.job-index }}
          path: ${{ runner.temp }}/timings.json
          retention-days: 1
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (not deployed — only releases deploy)
        run: npm run build

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Translation coverage
        run: node scripts/i18n-check.js --summary "$GITHUB_STEP_SUMMARY"

  # The multiplayer relay (relay/, Go, its own go.mod) and the federation vectors both implementations share
  # (docs/FEDERATION-PROTOCOL.md). A release from before the relay has no relay/: then there is nothing to do.
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: has
        run: |
          if [ -f relay/go.mod ]; then echo "relay=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No relay/ in this commit: nothing to test."; echo "relay=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.has.outputs.relay == 'true'
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.has.outputs.relay == 'true'
        with:
          node-version: 24
      - name: go vet
        if: steps.has.outputs.relay == 'true'
        working-directory: relay
        run: go vet ./...
      - name: go test -race
        if: steps.has.outputs.relay == 'true'
        working-directory: relay
        run: go test -race ./...
      - name: The generated vectors are up to date
        if: steps.has.outputs.relay == 'true'
        run: node scripts/fed-vectors.js --check
      # The site build makes servers.json in Node (scripts/registry.js) so it never needs Go; the relay makes it too.
      # Both must write the same bytes, for the real folder and for the spec's build vector (the folder is often empty).
      - name: servers.json, the build's and the relay's, byte for byte
        if: steps.has.outputs.relay == 'true'
        run: |
          set -euo pipefail
          (cd relay && go build -o "$RUNNER_TEMP/relay" ./cmd/relay)
          w="$RUNNER_TEMP/registry"
          node scripts/registry.js unpack federation/vectors/registry/016-build-servers-json.json "$w/vector"
          for dir in federation/servers "$w/vector"; do
            node scripts/registry.js build "$dir" "$w/node.json"
            "$RUNNER_TEMP/relay" build-servers-json "$dir" "$w/go.json"
            if ! cmp "$w/node.json" "$w/go.json"; then
              echo "::error::servers.json from $dir differs between scripts/registry.js and relay build-servers-json"
              diff <(jq -S . "$w/node.json") <(jq -S . "$w/go.json") || true
              exit 1
            fi
            echo "$dir: identical ($(wc -c < "$w/node.json") bytes)"
          done

  # A pull request that adds or changes a server file in the registry (federation/servers/, docs/FEDERATION-PROTOCOL.md
  # 11.2): the relay checks each one, including that a node answers the live challenge. Deleting a file needs no check.
  registry:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The merge commit and its first parent, the base branch as it is now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: files
        name: Server files in this pull request
        run: |
          set -euo pipefail
          files=$(git diff --name-only --diff-filter=d HEAD^1 HEAD -- federation/servers/)
          bad=0
          for f in $files; do
            if [ "$f" = federation/servers/README.md ]; then continue; fi
            if ! [[ "$f" =~ ^federation/servers/[A-Za-z0-9_-]{43}\.json$ ]]; then
              echo "::error file=$f::Only <server identity>.json files (and README.md) belong in federation/servers/"; bad=1
            fi
          done
          [ "$bad" = 0 ] || exit 1
          json=$(printf '%s\n' $files | grep '\.json$' | paste -sd ' ' || true)
          echo "files=$json" >> "$GITHUB_OUTPUT"
          if [ -z "$json" ]; then echo "No server files added or changed: nothing to check."; else echo "To check: $json"; fi
      # The checker is built from the base branch, never from the pull request: a pull request that changed both
      # relay/ and federation/servers/ could otherwise pass its own check. The base is checked out outside the
      # workspace, so nothing from the pull request (a go.work, a go.mod toolchain line) reaches that build.
      - name: Base branch for the checker
        if: steps.files.outputs.files != ''
        run: git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.files.outputs.files != ''
        with:
          go-version-file: ${{ runner.temp }}/base/relay/go.mod
          cache: false
      - name: relay check-registry (with the live challenge)
        if: steps.files.outputs.files != ''
        env:
          FILES: ${{ steps.files.outputs.files }}
          GOWORK: 'off'
          GOFLAGS: -mod=readonly
        run: |
          set -uo pipefail
          (cd "$RUNNER_TEMP/base/relay" && go build -o "$RUNNER_TEMP/relay" ./cmd/relay) || exit 1
          # The relay's output quotes the files, which come from the pull request: never read it as workflow commands.
          stop="stop-$RANDOM$RANDOM$RANDOM"
          failed=0
          { echo "## Registry check"; echo; } >> "$GITHUB_STEP_SUMMARY"
          for f in $FILES; do
            out=$("$RUNNER_TEMP/relay" check-registry --base HEAD^1 "$f" 2>&1); code=$?
            echo "::stop-commands::$stop"
            echo "----- $f"; echo "$out"
            echo "::$stop::"
            if [ "$code" = 0 ]; then
              echo "- \`$f\`: passed" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=1
              first=$(echo "$out" | grep -m1 . | tr -d '\r' | sed 's/%/%25/g' | cut -c1-300)
              echo "::error file=$f,title=Registry check failed::${first:-relay check-registry exited with $code}"
              { echo "- \`$f\`: **failed**"; echo; echo '```'; echo "$out" | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$failed" = 1 ]; then
            echo "A registry file failed: the lines above name the file, the step and the error code (docs/FEDERATION-PROTOCOL.md 11.2; federation/servers/README.md explains each step)."
            exit 1
          fi

  # The one check to look at: green only when the plan, every part, the build, the translations, the relay and (on a
  # pull request) the registry check are.
  test:
    needs: [plan, part, build, translations, relay, registry]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Everything passed
        run: |
          echo "plan: ${{ needs.plan.result }}, parts: ${{ needs.part.result }}, build: ${{ needs.build.result }}, translations: ${{ needs.translations.result }}, relay: ${{ needs.relay.result }}, registry: ${{ needs.registry.result }}"
          test "${{ needs.plan.result }}" = success && test "${{ needs.part.result }}" = success
          test "${{ needs.build.result }}" = success && test "${{ needs.translations.result }}" = success
          test "${{ needs.relay.result }}" = success
          test "${{ needs.registry.result }}" = success || test "${{ needs.registry.result }}" = skipped

  # After a run on main: each file's time from this run goes into the cache, so the next run (main or a PR) splits
  # its parts by today's tests. Nobody has to remember to refresh tests/durations.json.
  timings:
    needs: part
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.part.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/durations.json
          key: test-durations-${{ github.run_id }}
          restore-keys: test-durations-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: timings-*
          path: ${{ runner.temp }}/timings
      - run: node scripts/test-timings.js --merge "$RUNNER_TEMP/timings"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/durations.json
          key: test-durations-${{ github.run_id }}
