# Keeps what the workflows, the container images and the relay pin up to date: every GitHub Action is pinned to a
# commit SHA (Dependabot moves the SHA and its version comment together), the game image's Node base to a digest, the
# npm tools to the lockfile, the relay's Go modules to go.sum, and the relay's Go build image and Compose images to their
# tags. Updates come as pull requests, one group per ecosystem, once a week. CI builds and tests the relay with the Go of
# relay/go.mod (go-version-file), so a Go toolchain update there and the golang image in relay/Dockerfile go together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    # The image runs the Node major CI tests on (ci.yml); a new major comes with CI, by hand.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "Container"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      tools:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "Tools"

  - package-ecosystem: gomod
    directory: /relay
    schedule:
      interval: weekly
      day: monday
    groups:
      relay-go:
        patterns: ["*"]
    commit-message:
      prefix: "Relay"

  - package-ecosystem: docker
    directory: /relay
    schedule:
      interval: weekly
      day: monday
    groups:
      relay-image:
        patterns: ["*"]
    commit-message:
      prefix: "Relay"

  - package-ecosystem: docker-compose
    directory: /relay
    schedule:
      interval: weekly
      day: monday
    groups:
      relay-compose:
        patterns: ["*"]
    commit-message:
      prefix: "Relay"
