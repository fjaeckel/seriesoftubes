name: Bug report
description: Something in the game is broken, looks wrong or crashes.
title: "[bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more of this you fill in, the faster it gets fixed.
        **One bug per issue, please.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what went wrong. Screenshots or a screen recording help a lot. Drag them into this box.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do right before it happened?
      placeholder: |
        1. Open the Infra tab in Frankfurt
        2. Tap "Upgrade to 400G"
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version
      description: Shown at the bottom of the title screen, and in the menu under "What's new".
      placeholder: "1.25.1"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Android phone
        - iPhone
        - Android tablet
        - iPad
        - Desktop or laptop
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Firefox 159 on Android 16, Safari on iOS 26.1, Chrome 141 on Windows…"
    validations:
      required: true
  - type: dropdown
    id: installed
    attributes:
      label: Installed as an app?
      description: Did you add Series of Tubes to your home screen, or do you play in a browser tab?
      options:
        - In a browser tab
        - Installed on the home screen
        - Not sure
    validations:
      required: true
  - type: textarea
    id: save
    attributes:
      label: Saved game (optional, very helpful)
      description: Menu → "Export save", then attach the file here. It lets us load your exact network.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this one is not already reported.
          required: true
        - label: This issue is about one bug only.
          required: true
